<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#078a72" />
  <title>NICCA Connect+</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <main class="app-shell">
    <section id="loginView" class="login-screen">
      <div class="login-panel">
        <div class="brand-lockup">
          <img class="brand-logo" src="nicca-logo.png" alt="NICCA" />
          <h1>NICCA Connect+</h1>
          <p>Connect <span>•</span> Communicate <span>•</span> Collaborate</p>
        </div>

        <form id="loginForm" class="login-form">
          <label class="field">
            <span class="field-icon">●</span>
            <input id="userId" type="text" autocomplete="username" placeholder="User ID" required />
          </label>

          <label class="field">
            <span class="field-icon lock">▣</span>
            <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
            <button id="togglePassword" class="eye-btn" type="button" aria-label="Tampilkan password">◉</button>
          </label>

          <button class="login-btn" type="submit">
            <span class="login-arrow">↪</span>
            LOGIN
          </button>

          <p id="loginError" class="error"></p>

          <div class="secure-note">
            <div><span></span> Secure Login <span></span></div>
            <p>◆ &nbsp; Encrypted & Secure</p>
          </div>
        </form>
      </div>
    </section>

    <section id="chatView" class="chat-card hidden">
      <header class="app-header">
        <div class="header-brand">
          <img src="nicca-logo.png" alt="" />
          <div>
            <h2>NICCA Connect+</h2>
            <p>Connect • Communicate • Collaborate</p>
          </div>
        </div>
        <button id="logoutBtn" class="icon-button" type="button" aria-label="Logout">⋮</button>
      </header>

      <section class="room-header">
        <div class="room-icon">👥</div>
        <div class="room-copy">
          <h3>General Chat</h3>
          <p><span class="online-dot"></span><span id="currentUserLabel">Online</span></p>
        </div>
        <div class="room-info">ⓘ</div>
      </section>

      <div id="messages" class="messages"></div>

      <form id="messageForm" class="message-form">
        <button class="composer-icon" type="button" aria-label="Emoji">☺</button>
        <input id="messageInput" type="text" maxlength="1000" autocomplete="off" placeholder="Type a message..." required />
        <button class="composer-icon attachment-button" type="button" aria-label="Lampiran" title="Fitur kirim foto akan ditambahkan berikutnya">⌕</button>
        <button class="send-button" type="submit" aria-label="Kirim pesan">➤</button>
      </form>
    </section>
  </main>

  <script type="module" src="app.js?v=7"></script>
</body>
</html>
